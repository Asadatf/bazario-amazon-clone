# Render blueprint for the API. The database is Neon (set DATABASE_URL by hand); the web app is on Vercel.
services:
  - type: web
    name: bazario-api
    runtime: docker
    rootDir: api
    plan: free
    region: oregon # same region as the Neon database (aws-us-west-2)
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: MOCK_WEBHOOK_SECRET
        generateValue: true
      - key: WEB_ORIGINS
        # Only matters for direct cross-origin calls; the Vercel app proxies /api/v1 so the browser stays same-origin.
        value: https://bazario-amazon-clone.vercel.app
      - key: COOKIE_SECURE
        value: "true"
      - key: PAYMENT_PROVIDER
        value: mock
